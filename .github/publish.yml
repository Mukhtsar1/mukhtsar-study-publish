name: Publish scheduled carousels

# Runs hourly and publishes anything whose slot has passed.
#
# Hourly rather than at the exact posting times: a cron that fires only at
# 18:00 UTC on three days publishes nothing if that one run fails or if you
# schedule a post for another day. GitHub also delays scheduled runs under
# load, so "on the hour" is approximate whatever we write here. Publishing by
# QUEUE rather than by CRON TIME means a missed hour is picked up by the next.
on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Check the queue without publishing"
        type: boolean
        default: false

# Two runs publishing the same post at once would create a duplicate.
concurrency:
  group: mukhtsar-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # to commit the updated queue back

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install system libs for WeasyPrint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libpango-1.0-0 libpangoft2-1.0-0 \
            libharfbuzz0b libfribidi0 libcairo2

      - name: Install Python deps
        run: pip install -q -r requirements.txt

      - name: Publish anything past its slot
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IMAGE_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main/out
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m src.run schedule
          else
            python -m src.run publish-due
          fi

      # The queue records what was published and when. Committing it back is
      # what stops the next hourly run from publishing the same post again.
      - name: Save the queue
        if: ${{ inputs.dry_run != 'true' }}
        run: |
          if git diff --quiet content/schedule.json content/state.json; then
            echo "Nothing published this run."
          else
            git config user.name "mukhtsar-pipeline"
            git config user.email "actions@github.com"
            git add content/schedule.json content/state.json
            git commit -m "Published scheduled carousel [skip ci]"
            git push
          fi
