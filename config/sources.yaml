# Live sources for topic discovery.
#
# `python -m src.run sources --check` tests every feed and reports which answer.
# Do that before trusting this list: feed URLs move and die, and a dead feed
# costs the full timeout on every run.
#
# A HEADLINE IS A PROMPT, NOT A FACT. Nothing fetched here reaches a slide.

max_age_days: 45

# An entry must name one of these SUBJECTS...
# Country names are deliberately absent. Matching on "malaysia" alone let a
# bomb scare, an electricity bill and a haze report through as education
# topics, because every story in a Malaysian feed says Malaysia.
topic_keywords:
  - student pass
  - student visa
  - international student
  - foreign student
  - emgs
  - university
  - universiti
  - campus
  - higher education
  - tuition fee
  - intake
  - enrolment
  - enrollment
  - scholarship
  - mqa
  - graduate
  - undergraduate
  - study abroad
  - education ministry

# ...AND one of these PLACES. Leave empty to accept any location.
geo_keywords:
  - malaysia
  - malaysian
  - kuala lumpur
  - putrajaya
  - selangor

exclude_keywords:
  - football
  - badminton
  - celebrity
  - horoscope
  - lottery
  - betting
  - murder
  - bomb
  - arrested

feeds:
  # Topic-scoped searches. These carry the subject in the query itself, so they
  # are far cleaner than a general news feed.
  - name: Google News — Malaysia international students
    url: https://news.google.com/rss/search?q=malaysia+international+students+university&hl=en-MY&gl=MY&ceid=MY:en
    tag: "مستجدات"
    eyebrow: "WHAT CHANGED"
    icon: university
    enabled: true

  - name: Google News — EMGS student pass
    url: https://news.google.com/rss/search?q=EMGS+OR+%22student+pass%22+malaysia&hl=en-MY&gl=MY&ceid=MY:en
    tag: "التأشيرة"
    eyebrow: "VISA NEWS"
    icon: document
    enabled: true

  - name: Google News — Malaysia university intake and fees
    url: https://news.google.com/rss/search?q=malaysia+university+intake+OR+%22tuition+fees%22&hl=en-MY&gl=MY&ceid=MY:en
    tag: "مستجدات"
    eyebrow: "WHAT CHANGED"
    icon: calendar
    enabled: true

  - name: The Star — Education
    url: https://www.thestar.com.my/rss/News/Education
    tag: "مستجدات"
    eyebrow: "WHAT CHANGED"
    icon: book
    enabled: true

  # General national news. Off by default — these were the source of the
  # bomb-scare and electricity-bill results. Turn on only if the topic filter
  # proves tight enough for you.
  - name: Malay Mail — Malaysia
    url: https://www.malaymail.com/feed/rss/malaysia
    tag: "مستجدات"
    eyebrow: "WHAT CHANGED"
    icon: globe
    enabled: false

  - name: Free Malaysia Today
    url: https://www.freemalaysiatoday.com/feed/
    tag: "مستجدات"
    eyebrow: "WHAT CHANGED"
    icon: globe
    enabled: false
