# Idea backlog for `python -m src.run go` and `discover`.
#
# These are ANGLES, not finished topics. The pipeline picks unused ones, checks
# them against everything already published or drafted, and writes a draft for
# you to fill in and verify.
#
# NAMING: ids are multi-word and describe the angle, not the subject. That
# matters because one subject carries several posts — housing alone is worth a
# comparison, a contract guide and a scam warning. "housing" as an id burns the
# whole subject on one post and makes the output folders ambiguous.
#
# KEYWORDS: multi-word and Malaysian. A one-word query like "train" or "market"
# returns the whole world — the first live run pulled Tokyo, Osaka and Basel
# into a carousel about Kuala Lumpur. Name the place.

