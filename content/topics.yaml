# Mukhtsar carousel topic bank
# ---------------------------------------------------------------------------
# Each topic is one carousel. The pipeline picks the next unpublished topic,
# builds it on the given path, and publishes it.
#
# path:  A | A-img | B | B-img   (omit to let the rotation decide)
